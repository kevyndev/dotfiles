# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/config/monitors.conf        # Configures monitor layout and resolution
source = ~/.config/hypr/config/programs.conf        # General variables affecting the system
source = ~/.config/hypr/config/autostart.conf       # Defines application to launch on startup
source = ~/.config/hypr/config/environment.conf     # Sets environment variables ans system behavior
source = ~/.config/hypr/config/animations.conf      # Control window animations
source = ~/.config/hypr/config/decoration.conf      # Controls visuals settings like themes and wallpapers
source = ~/.config/hypr/config/input.conf           # Specifies input device rules
source = ~/.config/hypr/config/binds.conf     # Defines custom keybindings
source = ~/.config/hypr/config/window-rules.conf    # Window-specific rules for behavior and appearance
source = ~/.config/hypr/config/permissions.conf     # Control permissions
source = ~/.config/hypr/config/layout.conf          # 
source = ~/.config/hypr/config/misc.conf          # 

general {
    locale = pt_BR.UTF-8
}

# More info: https://wiki.hypr.land/
